services:
  # ── Flask API ────────────────────────────────────────────────────────────────
  - type: web
    name: wesley-library-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_PASSWORD
        sync: false
      - key: SNOWFLAKE_DATABASE
        sync: false
      - key: SNOWFLAKE_SCHEMA
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        sync: false
      - key: SNOWFLAKE_ROLE
        sync: false
      - key: CORS_ORIGIN
        value: https://wesley-library.onrender.com
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false

  # ── React / Vite static site ─────────────────────────────────────────────────
  - type: web
    name: wesley-library
    runtime: static
    plan: free
    buildCommand: cd church-library-frontend && npm ci && npm run build
    staticPublishPath: church-library-frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: wesley-library-api
          type: web
          property: host
